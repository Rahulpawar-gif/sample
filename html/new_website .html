<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C-Style Fashion Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #111;
    }

    .topbar {
      background: #000;
      color: #fff;
      text-align: center;
      font-size: 12px;
      padding: 8px 10px;
      letter-spacing: 0.5px;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid #eee;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
      font-size: 14px;
    }

    .nav-links a {
      text-decoration: none;
      color: #111;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 50px 40px;
      background: linear-gradient(90deg, #f7f4f1 0%, #ffffff 100%);
      min-height: 520px;
      gap: 40px;
    }

    .hero-text {
      max-width: 520px;
    }

    .hero-text h1 {
      font-size: 64px;
      line-height: 0.95;
      margin-bottom: 20px;
      font-family: Georgia, serif;
      font-weight: 600;
    }

    .hero-text p {
      font-size: 18px;
      color: #444;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid #111;
      text-decoration: none;
      font-size: 14px;
      color: #111;
      display: inline-block;
    }

    .btn.dark {
      background: #111;
      color: #fff;
    }

    .hero-image {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-image img {
      width: 100%;
      max-width: 560px;
      border-radius: 18px;
      object-fit: cover;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      padding: 0 40px;
      margin-top: -28px;
    }

    .feature {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.06);
    }

    .feature h4 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .feature p {
      font-size: 12px;
      color: #666;
    }

    .section {
      padding: 50px 40px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-header h2 {
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .category-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 18px;
    }

    .category {
      text-align: center;
    }

    .circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #f1f1f1;
      margin: 0 auto 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 18px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 12px;
    }

    .card-body h4 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .price {
      font-weight: bold;
      font-size: 14px;
    }

    .banner-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 30px;
    }

    .banner {
      min-height: 170px;
      border-radius: 16px;
      color: #fff;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
    }

    .banner * {
      position: relative;
      z-index: 1;
    }

    .banner h3 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .footer {
      background: #111;
      color: #fff;
      padding: 18px 40px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      text-align: center;
      margin-top: 40px;
    }

    @media (max-width: 1100px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }
      .features,
      .category-row,
      .products,
      .banner-grid,
      .footer {
        grid-template-columns: repeat(2, 1fr);
      }
      .nav-links {
        display: none;
      }
    }

    @media (max-width: 700px) {
      .navbar,
      .hero,
      .section,
      .topbar,
      .features,
      .footer {
        padding-left: 16px;
        padding-right: 16px;
      }

      .hero-text h1 {
        font-size: 42px;
      }

      .features,
      .category-row,
      .products,
      .banner-grid,
      .footer {
        grid-template-columns: 1fr;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: center;
      }

      .category-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
