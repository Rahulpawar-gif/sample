<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <link rel="shortcut icon" href="" type="image/x-icon">
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
.nav_bar{
height: 100px;
width: 100%;
background-color: burlywood;
display: flex;
align-items: center;
flex-direction: column;

}
.box_1{
height: 100px;
width: 25%;
background-color: rgb(190, 103, 173);
}

.box_2{
height: 100px;
width: 25%;
background-color: rgb(16, 235, 107);
}
.box_3{
height: 100px;
width: 25%;
background-color: rgb(161, 53, 53);
}
.box_4{
height: 100px;
width: 25%;
background-color: rgb(76, 126, 205);
}

.box_11{
height: 100px;
width: 25%;
background-color: rgb(190, 103, 173);
display: flex;
align-items: center;
flex-direction: column;
}

.box_22{
height: 100px;
width: 25%;
background-color: rgb(16, 235, 107);
display: flex;
align-items: center;
flex-direction: column;
}
.box_33{
height: 100px;
width: 25%;
background-color: rgb(161, 53, 53);
display: flex;
align-items: center;
flex-direction: column;
align-items: center;
}
.box_44{
height: 100px;
width: 25%;
background-color: rgb(76, 126, 205);
display: flex;
align-items: center;
flex-direction: column;
position: flex;
}

    
</style>
</head>
<body>
    <nav class="nav_bar">
        <div class="box_1"></div>
        <div class="box_2"></div>
        <div class="box_3"></div>
        <div class="box_4"></div></nav>
        <main>

       <div class="box_11"></div>
        <div class="box_22"></div>
        <div class="box_33"></div>
        <div class="box_44"></div>
        </main>
    

</body>
</html>
